name: Build resume

# Compiles resume/Pulkit_Girdhar_Resume.tex to public/Pulkit_Girdhar_Resume.pdf,
# verifies it, and commits the PDF back so Vercel redeploys with the new file.
on:
  push:
    branches: [main]
    paths:
      - "resume/**"
      - ".github/workflows/build-resume.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-resume
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Pulkit_Girdhar_Resume.tex
          working_directory: resume

      - name: Verify PDF (one page, readable text layer)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          PDF=resume/Pulkit_Girdhar_Resume.pdf

          PAGES=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          echo "Pages: $PAGES"
          if [ "$PAGES" != "1" ]; then
            echo "::error::Resume must be exactly 1 page, got $PAGES"
            exit 1
          fi

          pdftotext -layout "$PDF" /tmp/resume.txt
          WORDS=$(wc -w < /tmp/resume.txt)
          echo "Extracted words: $WORDS"
          if [ "$WORDS" -lt 300 ]; then
            echo "::error::Text layer looks empty or broken ($WORDS words)"
            exit 1
          fi
          for term in "Pulkit Girdhar" "Experience" "Education" "Technical Skills"; do
            grep -q "$term" /tmp/resume.txt || { echo "::error::Missing '$term' in extracted text"; exit 1; }
          done

      - name: Publish PDF to public/
        run: cp resume/Pulkit_Girdhar_Resume.pdf public/Pulkit_Girdhar_Resume.pdf

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/Pulkit_Girdhar_Resume.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged, nothing to commit."
          else
            git commit -m "Rebuild resume PDF"
            git push
          fi
